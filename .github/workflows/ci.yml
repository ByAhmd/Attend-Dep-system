name: CI

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull-request runs are cancelled for fast feedback, but a run on
  # master is never cancelled: it may be deploying, and interrupting a
  # migration half-way is far worse than waiting for it.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  validate:
    name: Lint, analyse, test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    # 8.3 is the documented minimum; 8.4 is what Herd runs locally.
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: attendance_testing
          MYSQL_USER: attendance
          MYSQL_PASSWORD: attendance
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: attendance_testing
      DB_USERNAME: attendance
      DB_PASSWORD: attendance

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, iconv, intl, libxml, mbstring, pdo_mysql, xml, xmlreader, zip
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-php${{ matrix.php }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      # public/build is committed so the app deploys to hosting without Node.
      # The Vite build is byte-for-byte reproducible, so any difference here
      # means someone changed the theme and forgot to commit the result.
      - name: Committed theme is up to date
        run: |
          if ! git diff --exit-code -- public/build; then
            echo "public/build is stale. Run 'npm run build' and commit the result."
            exit 1
          fi

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (PHPStan)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -proot --silent; then
              exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become ready in time."
          exit 1

      - name: Run tests
        run: vendor/bin/phpunit

  # ---------------------------------------------------------------------------
  # Deploy to the live site.
  #
  # Only after BOTH PHP versions have passed lint, static analysis and the whole
  # test suite, and only for a push to master. It stays skipped until the
  # repository variable DEPLOY_ENABLED is set to "true", so a fork or a
  # half-configured repository never tries to reach a server.
  #
  # Configure once, in Settings:
  #   Variables : DEPLOY_ENABLED = true, and optionally HEALTH_URL
  #   Secrets   : SSH_HOST, SSH_USER, SSH_PORT, SSH_PRIVATE_KEY, DEPLOY_PATH
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/master' && github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'

    # Never let two deployments overlap, and never cancel one half-way: an
    # interrupted migration is far worse than a queued deployment.
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Update the server and run the deploy script
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch origin master
            # The server tracks master exactly. .env, vendor/ and storage/ are
            # ignored by git, so nothing configured on the server is touched.
            git reset --hard origin/master
            bash scripts/deploy.sh

      - name: Check the site answers
        if: vars.HEALTH_URL != ''
        run: |
          for i in $(seq 1 10); do
            if curl -fsS --max-time 15 "${{ vars.HEALTH_URL }}" > /dev/null; then
              echo "The site is up."
              exit 0
            fi
            sleep 5
          done
          echo "Deployed, but ${{ vars.HEALTH_URL }} did not answer. Check the server."
          exit 1
